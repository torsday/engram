[package]
name = "engram-mcp"
description = "MCP server exposing vault tools to Claude Desktop/Code via rmcp stdio transport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
engram-core = { workspace = true }
engram-index = { workspace = true }
rmcp = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-util"] }
rmcp = { workspace = true, features = ["client"] }
