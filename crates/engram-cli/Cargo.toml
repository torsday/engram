[package]
name = "engram-cli"
description = "engram binary entry point with clap subcommands"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "engram"
path = "src/main.rs"

[dependencies]
engram-core = { workspace = true }
engram-index = { workspace = true }
rusqlite = { workspace = true }
engram-agents = { workspace = true }
engram-api = { workspace = true }
engram-eval = { workspace = true }
engram-llm = { workspace = true }
engram-mcp = { workspace = true }
engram-secrets = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
toml = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[test]]
name = "serve_mcp_stdio"
path = "tests/serve_mcp_stdio.rs"
