[package]
name = "engram-agents"
description = "Agent host: scheduler, runner, identity, tool gateway, prompt loader, council deliberation engine, review queue, trust score tracker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
engram-core = { workspace = true }
engram-index = { workspace = true }
rusqlite = { workspace = true }
ulid = { workspace = true }
sha2 = "0.10"
engram-llm = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
toml = { workspace = true }
async-trait = { workspace = true }
comrak = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
engram-llm = { workspace = true, features = ["mock-llm"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
