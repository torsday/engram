[package]
name = "engram-index"
description = "SQLite metadata index (FTS5), LanceDB vector storage, link graph, embedding pipeline, and hybrid search"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
engram-core = { workspace = true }
engram-llm = { workspace = true }
async-trait = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
ulid = { workspace = true }
sha2 = "0.10"

# Vector storage (LanceDB)
lancedb = "0.29"
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
engram-llm = { workspace = true, features = ["mock-llm"] }
tempfile = "3"
proptest = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "fts_bench"
harness = false
