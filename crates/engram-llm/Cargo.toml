[package]
name = "engram-llm"
description = "LLM provider trait + Anthropic implementation with prompt caching, structured output, embeddings"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
engram-core = { workspace = true }
engram-secrets = { workspace = true }
async-trait = { workspace = true }
bytes = "1"
chrono = { workspace = true }
futures-util = "0.3"
rand = { workspace = true }
reqwest = { workspace = true }
secrecy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# Enable the deterministic mock LLM provider for tests. Never enabled in
# release builds — prevents accidental use of mock responses in production.
mock-llm = []

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
