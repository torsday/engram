# Per-model price table for engram-llm cost computation.
#
# All rates are in US cents per million tokens.
# Sources: https://docs.anthropic.com/en/docs/about-claude/models (2026-05-20)
#          https://docs.anthropic.com/en/docs/build-with-claude/prompt-caching
#
# cache_read_cents_per_million_tokens  — cache-hit reads (10% of base input)
# cache_creation_cents_per_million_tokens — first write into cache (25% of input → 125% of base)
# input_cents_per_million_tokens       — non-cached input tokens
# output_cents_per_million_tokens      — generated output tokens

