# Case 003 — boundary case: exactly at the sparse-content threshold.
#
# 200 human notes, 60 days. The gate is `<` not `≤`, so this *passes*
# (see `SparseContentGate::should_abstain` — both axes must be `<`
# threshold to abstain). The Biographer runs and produces a biography,
# but moderate confidence because the corpus is barely sufficient.
#
# This case exists to catch off-by-one regressions in the gate logic.
id: 003-at-threshold-passes
description: >
  Vault exactly at the gate boundary (200 notes / 60 days). Gate must
  not abstain; Biographer produces a real (lower-confidence) biography.
input:
  vault_state: snapshot/cases/003/at-threshold-vault.tar
expected:
  # We expect a real biography (not the abstention stub at 1.0).
  min_confidence: 0.5
  max_confidence: 0.85
scoring:
  precision_weight: 1.0
  recall_weight: 1.0
  calibration_weight: 1.0
  cost_weight: 0.2
