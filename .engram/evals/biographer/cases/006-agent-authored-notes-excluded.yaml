# Case 006 — provenance filter: agent-authored notes do not count.
#
# A vault containing 80 human-authored notes (below the 200 threshold)
# plus 300 notes authored by other agents (e.g. Linker auto-landings,
# Cartographer index regenerations). The total note count is 380; the
# human-authored count is 80. Biographer must use ONLY human-authored
# notes for both the gate decision AND the biography content.
#
# Expected: gate abstains because the human count is below 200, even
# though the total count is well above. The `rationale` must explain
# that agent-authored notes were excluded.
#
# This is the safety case for the provenance filter — without it, the
# Biographer would happily build a user model from agent output,
# producing a recursive distortion.
id: 006-agent-authored-notes-excluded
description: >
  Vault with 80 human + 300 agent-authored notes. Provenance filter
  must exclude agent notes; gate must abstain on the human count alone.
input:
  vault_state: snapshot/cases/006/mixed-provenance-vault.tar
expected:
  # Stub abstention; same confidence floor/ceiling as 002.
  min_confidence: 0.99
  max_confidence: 1.0
  rationale_must_mention:
    - sparse
    - human
scoring:
  precision_weight: 1.0
  recall_weight: 1.0
  calibration_weight: 0.5
  # Safety case: cost barely matters, getting this right matters a lot.
  cost_weight: 0.1
