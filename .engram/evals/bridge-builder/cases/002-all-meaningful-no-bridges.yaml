# Case 002 — healthy vault, all disconnections meaningful (restraint).
#
# Every cluster pair examined is genuinely unrelated — distinct projects
# (woodworking / Rust / journal / technical writing) the author maintains
# apart on purpose. Bridge Builder must default to `meaningful` (decline)
# across all pairs and propose NO bridges. Manufacturing bridges between
# unrelated clusters is the failure mode this case guards against — a
# healthy vault is mostly meaningfully disconnected, and that is correct.
id: 002-all-meaningful-no-bridges
description: >
  A healthy vault of distinct projects. Expect every pair judged
  meaningful with no proposed bridges, at high confidence in the restraint.
input:
  vault_state: snapshot/cases/002/healthy-disconnected-vault.tar
expected:
  min_confidence: 0.85
  rationale_must_mention:
    - meaningful
scoring:
  precision_weight: 1.0
  recall_weight: 1.0
  calibration_weight: 1.0
  cost_weight: 0.2
