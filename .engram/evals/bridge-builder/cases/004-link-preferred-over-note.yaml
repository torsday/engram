#
# A real cross-cluster connection exists AND a specific note anchor fits it.
# Bridge Builder must prefer the lower-invasiveness accidental_link (a
# single wikilink) over manufacturing a whole bridge note. Reaching for a
# bridge note when a link suffices is needless structural change — the
# invasiveness ladder says use the lightest tool that closes the gap.
id: 004-link-preferred-over-note
description: >
  A connection a single anchor can carry. Expect a bridge link, not a
  heavier bridge note.
