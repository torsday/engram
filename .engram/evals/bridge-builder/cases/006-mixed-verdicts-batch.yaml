# Case 006 — realistic batch with mixed verdicts.
#
# A scan over several cluster pairs where most are meaningfully
# disconnected and exactly one is an accidental gap. Bridge Builder must
# bridge only the genuine gap while correctly declining the rest —
# precision matters as much as recall, because a single spurious bridge in
# a batch erodes trust in all of them.
id: 006-mixed-verdicts-batch
description: >
  Several pairs, mostly meaningful with one accidental gap. Expect a bridge
  only for the genuine gap and meaningful verdicts for the rest.
