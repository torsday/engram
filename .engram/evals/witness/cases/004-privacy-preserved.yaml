# AC: Output path is always under .engram/witness/, never in the vault
id: witness-privacy-preserved
description: >
  The output_path in every WitnessOutput must be under .engram/witness/.
  The vault note must never be referenced as a target for writing.
  This case verifies the privacy invariant: witness output stays out of
  the vault regardless of note content.

vault_state:
  notes:
    - path: "journal/2026-03-01.md"
      content: |
        ---
        title: March 1
        id: 01JPXXXXXXXXXXXXXXXX
        type: journal
        ---
        I told my manager today that I've been struggling. It felt
        terrifying but also like the right thing to do. I don't know
        what happens next. Just writing it down so it exists somewhere.

trigger:
  kind: file_change
  note_path: "journal/2026-03-01.md"
  captured_at: "2026-03-01T17:08:00Z"

expected_output:
  confidence_min: 0.85
  rationale_nonempty: true
  acknowledgment_nonempty: true
  # The output_path must always start with .engram/witness/
  output_path_prefix: ".engram/witness/"
  # Must NOT reference the vault note path
  output_path_must_not_contain: "journal/"
