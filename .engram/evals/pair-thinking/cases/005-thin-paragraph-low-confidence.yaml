# Case 005 — calibration: paragraph too thin for a good question.
#
# The user has written only a sentence or two — too early and too thin to
# ask a question that earns its interruption. A well-calibrated
# Pair-Thinking reports low confidence (and may set should_end) rather than
# forcing a vapid "what do you mean?" that breaks the writer's flow.
# Interrupting with a low-value question is the cost this agent must
# weigh; over-confidence here is the failure mode. We assert a ceiling.
