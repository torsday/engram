[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    # engram workspace crates are proprietary / all-rights-reserved.
    "LicenseRef-proprietary",
]
# Licenses not in the allow list are denied by default (cargo-deny 0.16+).
# GPL-3.0 and AGPL-3.0 are implicitly denied by not being listed above.

[bans]
multiple-versions = "warn"

[advisories]
version = 2
# Ignore unmaintained notices for transitive deps until we can upgrade them.
# bincode 1.x (via syntect): RUSTSEC-2025-0141
# yaml-rust (via serde_yaml 0.9): RUSTSEC-2024-0320
# encoding (via syntect → lance): RUSTSEC-2021-0153
# paste (via lance transitive): RUSTSEC-2024-0436
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0320",
    "RUSTSEC-2021-0153",
    "RUSTSEC-2024-0436",
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
