# Inquirer — generate good questions about the vault from multiple
# vantage points. Consolidates four previously-separate agents
# (Interlocutor, Prompt Drafter, Question Generator, Blindspot Finder)
# into one prompt with four modes selected at runtime.
#
# Per `docs/design/01-agents-and-council.md` §Inquirer:
#   - daily-reactive   — end-of-day question connecting today's
#                        changes to vault history (inbox note).
#   - seed-empty-note  — 3–5 seeded questions inserted into a new
#                        empty note; auto-deleted after 48h if unused.
#   - holistic-gap     — weekly questions the vault can't currently
#                        answer; `questions/YYYY-WNN.md`.
#   - blindspot        — quarterly negative-space analysis;
#                        `reflections/blindspots-YYYY-QN.md`.
#
# Invasiveness: None (inbox-only — never modifies existing content).
# The runner dispatches by mode via the TriggerContext; mode selection
# is a runtime concern, not a config switch.

[agent]
name = "inquirer"
description = "Generate questions about the vault from four vantage points (daily-reactive, seed-empty-note, holistic-gap, blindspot)."
model_tier = "standard"

[schedule]
# The runner peeks the trigger kind to decide dispatcher; the four
# modes share `on_demand` here because the scheduler wiring lives in
# the per-mode dispatchers (separate slice). The CLI surface
# `engram run inquirer --mode <m>` is the operator entry point.
trigger = "on_demand"

[permissions]
# Inquirer only ever creates new question notes — it never modifies or
# deletes existing content. Outputs land in dedicated paths per mode
# (inbox/, questions/, reflections/).
may_create_notes = true
may_modify_notes = false
may_delete_notes = false
note_types = ["fleeting"]
# "Additive" matches inbox-only output: new files, no edits, no deletes.
max_invasiveness = "additive"

[autonomy]
# Inbox-only output is the safest invasiveness class — even imperfect
# questions are valuable; the human triages them in the inbox. Auto-
# land floor sits below the editorial agents (Steelman 0.85, Devil's
# Advocate 0.90) because the cost of a bad inbox question is low.
auto_land_min_confidence = 0.75

[council]
# Inquirer is a thinking-output agent, not a council participant. It
# may *seed* council deliberations (a question generated by Inquirer
# can be the topic of a Research Council session) but it doesn't
# vote, gate, or critique inside one.
participates = false
may_convene = false

[budget]
# Standard tier; modest monthly cap. Operators tune via
# `engram secrets` + agent_budgets table updates.
monthly_tokens = 100000
auto_pause = true
