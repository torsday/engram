name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~20-30 GB by removing preinstalled toolchains this build
      # never uses (Android SDK, .NET, GHC, large CLIs). The single build
      # job runs fmt → clippy --all-targets → test --workspace, so the
      # shared `target/` accumulates across steps; by the `test` link of
      # the LanceDB/datafusion/lance test binaries the stock ubuntu-latest
      # runner (~14 GB free) hits `rustc-LLVM ERROR: IO failure on output
      # stream: No space left on device`. Freeing disk up front is the
      # lowest-risk fix (no job restructure, no behavior change). Sibling
      # of the `cache-targets: false` mitigation below (see #212).
      - name: free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false # apt purge is slow; tool-cache + the dirs below reclaim enough
          docker-images: false
          swap-storage: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # `cache-targets: false` — only cache `~/.cargo/registry` + `~/.cargo/git`
      # + the lockfile-keyed dep build artifacts under `~/.cargo/`, not the
      # workspace `target/` directory. The full `target/` for this workspace
      # (LanceDB + datafusion + comrak + rusqlite + lance pulls in ~2 GB)
      # overflowed the runner's disk during the post-run cache save (see
      # #212). Trade-off: slightly slower clean builds, but PRs unblock.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: docs format check
        run: npx --yes prettier --check .

  docs-drift:
    name: docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check mcp docs are up to date
        run: bash scripts/gen-mcp-docs.sh --check
