name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # `cache-targets: false` — only cache `~/.cargo/registry` + `~/.cargo/git`
      # + the lockfile-keyed dep build artifacts under `~/.cargo/`, not the
      # workspace `target/` directory. The full `target/` for this workspace
      # (LanceDB + datafusion + comrak + rusqlite + lance pulls in ~2 GB)
      # overflowed the runner's disk during the post-run cache save (see
      # #212). Trade-off: slightly slower clean builds, but PRs unblock.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: docs format check
        run: npx --yes prettier --check .

  docs-drift:
    name: docs drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check mcp docs are up to date
        run: bash scripts/gen-mcp-docs.sh --check
