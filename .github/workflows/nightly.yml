name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-llm:
    name: real-llm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: real-provider tests
        env:
          ENGRAM_REAL_LLM: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping real-provider tests"
            exit 0
          fi
          cargo test --workspace -- --ignored

  sbom:
    name: sbom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: install cargo-cyclonedx
        # Pinned: cargo-cyclonedx 0.5.x dropped the --output-file flag the
        # job used to pass; pin so an upstream CLI change can't silently
        # re-break SBOM generation (see issue #312).
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: generate SBOM
        # --describe crate (default) emits one CycloneDX SBOM per workspace
        # member at crates/<member>/sbom.json. --override-filename sets the
        # base name; there is no --output-file in this version.
        run: cargo cyclonedx --format json --override-filename sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: crates/*/sbom.json
          retention-days: 30
